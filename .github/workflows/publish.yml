name: Publish

# Publishes the CURRENT package.json version to npm on demand. The auto-release
# (release.yml) only fires on new commits; this lets an already-bumped+tagged
# version that missed publication (e.g. a failed trusted-publisher run)
# be published without a synthetic bump. If the version already exists, the
# workflow exits successfully when that version is already published.
on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@12.0.0

      - name: Validate release lock integrity
        run: node scripts/check-release-lock.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:preflight

      - run: pnpm release:check

      - name: Publish when absent
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published"
          else
            npm publish --access public
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"
